<section class="hero" aria-label="Hero — The Art of Time">

  <!-- Background image + overlay -->
  <div class="hero__media">
    <img
      [src]="heroImage"
      alt="A luxury watch against a dark editorial background — HOROLOGE"
      class="hero__img"
      loading="eager"
      fetchpriority="high"
    />
    <div class="hero__overlay" aria-hidden="true"></div>
  </div>

  <!-- Content -->
  <div class="hero__content">
    <h1 class="hero__heading">The Art of Time</h1>
    <a href="#discover" class="btn btn--primary" id="hero-discover-btn">Discover</a>
  </div>

</section>
