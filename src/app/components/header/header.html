<nav class="navbar" aria-label="Main navigation">
  <div class="navbar__inner">

    <!-- Left: Nav links (desktop) -->
    <div class="navbar__links" role="menubar">
      <a routerLink="/"
         routerLinkActive="nav-link--active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-link"
         role="menuitem">Boutique</a>
      <a routerLink="/collections"
         routerLinkActive="nav-link--active"
         class="nav-link"
         role="menuitem">Collections</a>
      <a routerLink="/heritage"
         routerLinkActive="nav-link--active"
         class="nav-link"
         role="menuitem">Heritage</a>
      <a routerLink="/journal"
         routerLinkActive="nav-link--active"
         class="nav-link"
         role="menuitem">Journal</a>
      <a routerLink="/concierge"
         routerLinkActive="nav-link--active"
         class="nav-link"
         role="menuitem">Concierge</a>
    </div>

    <!-- Centre: Brand Logo -->
    <a routerLink="/" class="navbar__logo" aria-label="HOROLOGE – go to homepage">
      HOROLOGE
    </a>

    <!-- Right: Icon actions -->
    <div class="navbar__icons">
      <button class="icon-btn" aria-label="Search" routerLink="/search">
        <span class="material-symbols-outlined">search</span>
      </button>
      <div class="profile-container">
        <button class="icon-btn" id="account-btn" aria-label="My account" (click)="toggleProfileMenu($event)">
          <span class="material-symbols-outlined">person</span>
        </button>

        @if (isProfileMenuOpen()) {
          <div class="profile-menu">
            <a routerLink="/profile" class="profile-menu__link" (click)="isProfileMenuOpen.set(false)">My Account</a>
            <a routerLink="/login" class="profile-menu__link" (click)="isProfileMenuOpen.set(false)">Log In</a>
            <a routerLink="/signup" class="profile-menu__link" (click)="isProfileMenuOpen.set(false)">Sign Up</a>
          </div>
        }
      </div>
      <a class="icon-btn icon-btn--cart" id="bag-btn" aria-label="Shopping bag" routerLink="/cart" style="text-decoration: none;">
        <span class="material-symbols-outlined">shopping_bag</span>
        @if (cartService.cartCount() > 0) {
          <span class="cart-badge">{{ cartService.cartCount() }}</span>
        }
      </a>
    </div>

  </div>
</nav>
