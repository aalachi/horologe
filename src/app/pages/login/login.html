<main class="page-login">
  <div class="login-card">
    
    <div class="login-brand">
      <h1 class="login-brand__title">HOROLOGE</h1>
      <div class="hairline hairline--short"></div>
    </div>
    
    <div class="login-content">
      <header class="login-header">
        <h2 class="login-header__title">Welcome Back</h2>
        <p class="login-header__body">Please enter your details to access your collection.</p>
      </header>
      
      <form class="login-form" (submit)="onSubmit(); $event.preventDefault()">
        
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" id="email" name="email" placeholder="concierge@horologe.com" type="email" autocomplete="email"/>
        </div>
        
        <div class="form-group">
          <div class="form-group__top">
            <label class="form-label" for="password">Password</label>
            <a class="form-link" href="#">Forgot Password?</a>
          </div>
          <input class="form-input" id="password" name="password" placeholder="••••••••" type="password" autocomplete="current-password"/>
        </div>
        
        <div class="login-actions">
          <button class="btn btn--solid btn--full-width group" type="submit">
            Sign In
            <span class="material-symbols-outlined btn-icon">arrow_forward</span>
          </button>
          
          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or</span>
            <div class="divider-line"></div>
          </div>
          
          <button class="btn btn--outline btn--full-width btn--google" type="button">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="currentColor"></path>
            </svg>
            Continue with Google
          </button>
        </div>
      </form>
      
      <footer class="login-footer">
        <p class="login-footer__text">
          Don't have an account? 
          <a class="login-footer__link" routerLink="/signup">Sign Up</a>
        </p>
      </footer>
    </div>
  </div>
</main>
