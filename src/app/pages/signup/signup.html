<main class="page-signup">
  <div class="signup-card">
    
    <div class="signup-brand">
      <h2 class="signup-brand__title">Join the Maison</h2>
      <p class="signup-brand__body">Enter the world of HOROLOGE and discover the art of timeless precision.</p>
    </div>
    
    <div class="signup-content">
      <form class="signup-form" (submit)="onSubmit(); $event.preventDefault()">
        
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-input" placeholder="ALEXANDER VANE" type="text" autocomplete="name"/>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input" placeholder="AVANE@MAISON.COM" type="email" autocomplete="email"/>
        </div>
        
        <div class="form-group">
          <label class="form-label">Create Password</label>
          <input class="form-input" placeholder="••••••••••••" type="password" autocomplete="new-password"/>
        </div>
        
        <div class="signup-actions">
          <button class="btn btn--solid btn--full-width group" type="submit">
            Create Account
          </button>
          
          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Or continue with</span>
            <div class="divider-line"></div>
          </div>
          
          <button class="btn btn--outline btn--full-width btn--google" type="button">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
            </svg>
            Google
          </button>
        </div>
      </form>
      
      <footer class="signup-footer">
        <p class="signup-footer__text">
          Already have an account? 
          <a class="signup-footer__link" routerLink="/login">Log In</a>
        </p>
      </footer>
    </div>
  </div>
</main>
